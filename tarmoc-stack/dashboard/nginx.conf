server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # This is a single-page app that gets rebuilt often — always serve the current
    # version instead of letting browsers cache a stale copy after each deploy.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
